<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t6">
<title id="t6">MegaMoE 前向：通算与 Cube / Vector 同步流水</title>
<desc>Native指本页阶段式对照，不概括所有MoE实现。A/B表示两组专家，Dispatch将输入送到专家，GMM1使用gate/up，SwiGLU做门控激活，GMM2使用down，Combine返回结果。两种方法使用相同各阶段总工作量与假设时长，Native按整批阶段推进。Hyper的Cube队列按GMM1 A、GMM1 B、GMM2 A、GMM2 B排列，Vector的Dispatch、SwiGLU、Combine按各组完成信号推进。图同时表现通信和Cube计算重叠、SwiGLU和其他专家GMM重叠。通信仍使用Vector及搬运资源，外围准备、路由和最终token归约仍存在。</desc>
