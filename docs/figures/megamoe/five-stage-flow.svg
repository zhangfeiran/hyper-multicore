<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t5">
<title id="t5">MegaMoE：在五阶段核心内融合通算与 CV</title>
<desc>Forward 的五算子图是 kernel 融合核心，router、count exchange、permute 与最终 token 归约仍有外围调用。W13 为 gate/up 合并投影，W2 为 down。通信與激活由 AIV 执行，矩阵乘由 AIC 执行。Intermediate 与事件仍可能在 GM 中，不应描述成寄存器内全链路零拷贝。</desc>
